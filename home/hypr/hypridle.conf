# Real hyprlang config (not Nix-generated) -- see home/hypridle.nix's
# own comment for why. Deployed as part of the same directory-level
# home.file entry as base.lua/keybinds.lua/etc.
#
# lock_cmd/before_sleep_cmd stay on the direct, instant systemctl call --
# not the animated `qs ipc call lock-assembly trigger` path -- since both
# are suspend-adjacent: a lid close/reopen can cycle fast enough that the
# ~3s the animated path normally takes could still be in flight when the
# system resumes, which is exactly the exposure window minimizing the
# direct path exists to avoid (same reasoning as home/hypr/base.lua's own
# boot-time first lock). Only the idle-timeout listener below -- not
# suspend-adjacent, just "been idle a while" -- gets the animated trigger.
general {
    lock_cmd = systemctl --user start syland-lock.service
    before_sleep_cmd = systemctl --user start syland-lock.service
}

listener {
    timeout = 300
    on-timeout = qs ipc call lock-assembly trigger
}
